[package]
name = "qr-forensics"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Manual decoder for QR codes too damaged for a camera-based reader"

[dependencies]
eframe = "0.36"
image = { version = "0.25", default-features = false, features = [
    "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp",
] }
rfd = "0.17"
arboard = { version = "3", features = ["image-data"] }
encoding_rs = "0.8"
rayon = "1.12"
cubecl = { version = "0.11.3", features = ["wgpu"] }

[features]
default = ["avif"]
# Reading AVIF photos. It links the system's libdav1d, found through
# pkg-config; build with `--no-default-features` where there is none.
avif = ["image/avif-native"]
# Development aid: scripted UI run that saves screenshots. See src/app/selftest.rs.
selftest = []

[dev-dependencies]
qrcode-generator = { version = "6.1", default-features = false, features = ["qr", "micro-qr", "rmqr", "kanji"] }
rxing = { version = "0.9", default-features = false, features = ["decoders", "qrcode", "encoding_rs"] }
# Fetching the benchmarks too large to keep here: see tests/datasets/mod.rs.
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.10"
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
